# ===========================================================================
#   docker compose up -d          start
#   docker compose logs -f bot    follow logs
#   docker compose down           stop
#
# The bot reads .env for configuration.  Create it first:
#   cp .env.example .env && nano .env && chmod 600 .env
# ===========================================================================

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-trading-bot:latest
    container_name: crypto-trading-bot
    restart: unless-stopped

    env_file:
      - .env

    ports:
      # Bind to localhost only.  Put a reverse proxy with TLS in front before
      # exposing the dashboard to the internet.
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models

    # UTC everywhere: the daily-loss breaker rolls on the UTC day, and every
    # timestamp in the database is epoch UTC.
    environment:
      - TZ=UTC

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # A trading bot that is being starved of CPU makes late decisions, so give
    # it a floor rather than only a ceiling.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Optional PostgreSQL.  SQLite is the default and needs nothing.
  # Enable with:  docker compose --profile postgres up -d
  # then set in .env:
  #   DATABASE_URL=postgresql://bot:CHANGE_ME@postgres:5432/trading_bot
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: crypto-trading-bot-db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: trading_bot
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d trading_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
